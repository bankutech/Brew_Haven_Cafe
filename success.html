<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrewVerse | Order Tracking</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="portal.css">
  <link rel="stylesheet" href="checkout.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-mode portal-body success-page-body">
  <div class="portal-grain"></div>
  
  <div class="tracker-card reveal">
    <div style="margin-bottom: 20px;">
      <i class="fas fa-compass" style="color: var(--accent-gold); font-size: 2rem;"></i>
    </div>
    <h1 style="font-family: var(--font-heading); margin-bottom: 10px;">Order <span id="disp-order-num">#000000</span></h1>
    <p style="color: var(--text-secondary); margin-bottom: 30px;">Thank you for choosing <span id="disp-brand">BrewVerse</span>. Your order is now in our system.</p>
    
    <!-- Visual Timer -->
    <div class="timer-container">
      <svg class="timer-svg" viewBox="0 0 100 100">
        <circle class="timer-circle-bg" cx="50" cy="50" r="45"></circle>
        <circle class="timer-circle-progress" id="timer-progress" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="0"></circle>
      </svg>
      <div class="timer-text" id="timer-text">15:00</div>
    </div>
    <p style="font-size: 0.9rem; font-weight: 500; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px;">Estimated Prep Time</p>
    
    <!-- Stepper Timeline -->
    <div class="tracker-stepper">
      <div class="stepper-progress-line" id="stepper-line"></div>
      
      <div class="step active" id="step-1">
        <div class="step-icon"><i class="fas fa-check"></i></div>
        <div class="step-label">Received</div>
      </div>
      <div class="step" id="step-2">
        <div class="step-icon"><i class="fas fa-fire-burner"></i></div>
        <div class="step-label">Preparing</div>
      </div>
      <div class="step" id="step-3">
        <div class="step-icon"><i class="fas fa-bell"></i></div>
        <div class="step-label">Ready</div>
      </div>
    </div>
    
    <!-- Pickup QR Code -->
    <div class="pickup-code-box" id="pickup-box">
      <div class="barcode" id="disp-barcode">||| | ||||| || |||</div>
      <div class="pickup-label">Scan at Counter</div>
    </div>
    
    <!-- Receipt Accordion -->
    <div class="receipt-accordion" id="receipt-accordion">
      <div class="receipt-header" id="receipt-header">
        <span>Order Receipt</span>
        <i class="fas fa-chevron-down" style="transition: transform 0.3s;"></i>
      </div>
      <div class="receipt-content">
        <div id="receipt-items-container" style="margin-bottom: 15px;">
          <!-- Dynamically inserted items -->
        </div>
        <div style="border-top: 1px dashed var(--border-color); padding-top: 15px; margin-top: 15px;">
          <div class="receipt-item"><span>Subtotal</span> <span id="r-sub">$0.00</span></div>
          <div class="receipt-item"><span>Tax (8%)</span> <span id="r-tax">$0.00</span></div>
          <div class="receipt-total-row"><span>Total Paid</span> <span id="r-total" style="color: var(--accent-gold);">$0.00</span></div>
        </div>
        <div style="margin-top: 15px; padding: 10px; background: rgba(197, 155, 39, 0.1); border-radius: 8px; text-align: center; font-size: 0.9rem; color: var(--accent-gold);">
          <i class="fas fa-star"></i> You earned <strong id="r-pts">0</strong> Rewards Points!
        </div>
      </div>
    </div>
    
    <div class="success-actions">
      <a href="index.html" class="btn btn-primary" style="background: transparent; border: 1px solid var(--border-color);">Return Home</a>
      <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Print Receipt</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Load Data
      const orderDataStr = localStorage.getItem('brewverse_latest_order');
      let order = null;
      if(orderDataStr) {
        order = JSON.parse(orderDataStr);
      } else {
        // Fallback demo data
        order = {
          orderNumber: "BV-DEMO-123",
          portal: "BrewVerse",
          items: [{name: "Demonstration Item", qty: 1, price: 5.00}],
          subtotal: "5.00", tax: "0.40", total: "5.40", pointsEarned: 25
        };
      }
      
      document.getElementById('disp-order-num').textContent = '#' + order.orderNumber;
      document.getElementById('disp-brand').textContent = order.portal;
      document.getElementById('r-sub').textContent = '$' + order.subtotal;
      document.getElementById('r-tax').textContent = '$' + order.tax;
      document.getElementById('r-total').textContent = '$' + order.total;
      document.getElementById('r-pts').textContent = order.pointsEarned;
      
      const itemsContainer = document.getElementById('receipt-items-container');
      order.items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'receipt-item';
        div.innerHTML = `<span>${item.qty}x ${item.name}</span> <span>$${(item.price * item.qty).toFixed(2)}</span>`;
        itemsContainer.appendChild(div);
      });
      
      // Accordion Toggle
      const accordion = document.getElementById('receipt-accordion');
      const header = document.getElementById('receipt-header');
      const icon = header.querySelector('.fa-chevron-down');
      header.addEventListener('click', () => {
        accordion.classList.toggle('open');
        icon.style.transform = accordion.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
      });
      
      // 2. SVG Timer Logic
      const timerProgress = document.getElementById('timer-progress');
      const timerText = document.getElementById('timer-text');
      const totalTime = 15 * 60; // 15 mins
      const circumference = 283; // 2 * pi * 45
      const endTime = Date.now() + (totalTime * 1000);
      
      const timerInterval = setInterval(() => {
        const now = Date.now();
        const timeLeftMs = endTime - now;
        
        if(timeLeftMs <= 0) {
          clearInterval(timerInterval);
          timerText.textContent = "00:00";
          timerProgress.style.strokeDashoffset = circumference;
          return;
        }
        
        const timeLeftSec = Math.ceil(timeLeftMs / 1000);
        const m = Math.floor(timeLeftSec / 60);
        const s = timeLeftSec % 60;
        timerText.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        
        const offset = circumference - (timeLeftSec / totalTime) * circumference;
        timerProgress.style.strokeDashoffset = offset;
      }, 1000);
      
      // 3. Stepper Tracker Animation
      const sLine = document.getElementById('stepper-line');
      const step2 = document.getElementById('step-2');
      const step3 = document.getElementById('step-3');
      const pickupBox = document.getElementById('pickup-box');
      
      // After 5s -> Preparing
      setTimeout(() => {
        sLine.style.width = '50%';
        step2.classList.add('active', 'pulsing');
      }, 5000);
      
      // After 15s -> Ready
      setTimeout(() => {
        step2.classList.remove('pulsing');
        sLine.style.width = '100%';
        step3.classList.add('active', 'pulsing');
        
        // Show Barcode
        const randBar = order.orderNumber.replace(/\D/g, '').split('').map(n => parseInt(n) % 2 === 0 ? '|' : ' ').join('');
        document.getElementById('disp-barcode').textContent = `||| ${randBar} |||| ${randBar} |`;
        pickupBox.classList.add('show');
      }, 15000);
    });
  </script>
</body>
</html>
